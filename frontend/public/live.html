<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"/>
<title>DroZon LIVE · Misiuni umanitare în timp real</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Dashboard public DroZon — misiuni umanitare live cu flote de drone. IGSU, DSU, protecție civilă."/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --bg:#020810; --panel:#0a1017; --accent:#2e7fc4; --danger:#e35a5a;
  --ok:#7ee0a5; --warn:#f2b234; --border:#1e3248; --muted:#7a9ab8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100vh;font-family:'JetBrains Mono','SF Mono',monospace;background:var(--bg);color:#dceaf8;overflow:hidden;}
header{
  height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:linear-gradient(180deg,#080d15,#0a0f18);
  border-bottom:1px solid var(--border);z-index:100;position:relative;
}
.brand{display:flex;align-items:center;gap:14px;}
.logo{font-weight:900;font-size:20px;letter-spacing:5px;color:#dceaf8;}
.logo span{color:var(--accent);}
.tag{font-size:8px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;line-height:1.4;}
.tag b{color:#7ee0a5;}
.hstats{display:flex;gap:12px;}
.hs{background:rgba(46,127,196,.08);border:1px solid rgba(46,127,196,.22);padding:8px 14px;border-radius:4px;text-align:center;min-width:74px;}
.hs strong{display:block;font-size:20px;color:var(--accent);}
.hs span{font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.hs.act strong{color:#7ee0a5;}
.hs.msn strong{color:var(--warn);}
.hs.dng strong{color:var(--danger);}
.ws-status{display:inline-flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.ws-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);}
.ws-dot.on{background:#7ee0a5;box-shadow:0 0 8px #7ee0a5;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.wrap{position:absolute;top:64px;left:0;right:340px;bottom:0;}
#map{position:absolute;inset:0;}
.side{position:absolute;top:64px;right:0;bottom:0;width:340px;background:#0a0f18;border-left:1px solid var(--border);overflow-y:auto;padding:16px;}
.side h3{color:var(--accent);font-size:11px;letter-spacing:3px;margin:0 0 12px;text-transform:uppercase;font-weight:700;}
.dcard{background:#0e1520;border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.dcard:hover{border-color:var(--accent);background:#101a26;}
.dcard.act{border-left:3px solid #7ee0a5;}
.dcard.msn{border-left:3px solid var(--warn);}
.dcard.dng{border-left:3px solid var(--danger);}
.dcard.sb{border-left:3px solid var(--muted);}
.dcard .dn{font-weight:700;font-size:12px;color:#dceaf8;}
.dcard .dm{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.dcard .dst{display:inline-block;font-size:8px;padding:2px 6px;border-radius:2px;letter-spacing:2px;text-transform:uppercase;margin-top:6px;}
.dcard .bat{margin-top:6px;height:4px;background:#050a12;border-radius:2px;overflow:hidden;}
.dcard .bat i{display:block;height:100%;background:linear-gradient(90deg,#7ee0a5,#4dc0b5);border-radius:2px;}
.dcard .bat i.low{background:linear-gradient(90deg,#e35a5a,#f2b234);}
.foot{position:absolute;bottom:0;left:0;right:340px;text-align:center;padding:6px;font-size:9px;color:var(--muted);letter-spacing:2px;background:rgba(2,8,16,.85);border-top:1px solid var(--border);z-index:50;}
.foot a{color:var(--accent);text-decoration:none;}
.foot a:hover{text-decoration:underline;}
.marker-drone{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(46,127,196,.3) 0%,transparent 70%);border-radius:50%;font-size:20px;filter:drop-shadow(0 0 6px rgba(46,127,196,.5));cursor:pointer;}
.marker-drone.act{filter:drop-shadow(0 0 8px rgba(126,224,165,.7));}
.marker-drone.dng{filter:drop-shadow(0 0 10px rgba(227,90,90,.7));animation:pulseDng 1s infinite;}
@keyframes pulseDng{0%,100%{opacity:1;}50%{opacity:.7;}}
.maplibregl-popup-content{background:#0a1017 !important;color:#dceaf8 !important;border:1px solid var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px;}
.maplibregl-popup-tip{border-top-color:var(--accent) !important;}
.badge-live{display:inline-block;padding:4px 10px;background:rgba(126,224,165,.15);border:1px solid rgba(126,224,165,.4);color:#7ee0a5;border-radius:3px;font-size:9px;letter-spacing:3px;text-transform:uppercase;animation:pulse 1.6s infinite;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <div class="logo">DRO<span>ZON</span> · LIVE</div>
      <div class="tag">Dashboard public misiuni umanitare <b>· open data</b></div>
    </div>
    <span class="badge-live">🔴 LIVE</span>
  </div>
  <div class="hstats">
    <div class="hs act"><strong id="s-act">0</strong><span>Active</span></div>
    <div class="hs msn"><strong id="s-msn">0</strong><span>Misiune</span></div>
    <div class="hs"><strong id="s-sb">0</strong><span>Standby</span></div>
    <div class="hs dng"><strong id="s-dng">0</strong><span>Pericol</span></div>
    <div class="hs"><strong id="s-tot">0</strong><span>Total flotă</span></div>
  </div>
  <div class="ws-status"><span class="ws-dot" id="ws-dot"></span> <span id="ws-txt">Conectare...</span></div>
</header>

<div class="wrap"><div id="map"></div></div>
<aside class="side">
  <h3>🛸 Flota activă</h3>
  <div id="dlist"></div>
</aside>
<div class="foot">
  DroZon Public Dashboard · Date actualizate în timp real via WebSocket ·
  <a href="/drozon.html">→ Operator console</a> ·
  <a href="/api/stats" target="_blank">API stats</a>
</div>

<script>
const API_BASE = window.location.origin;
const STATUS_COLORS = {activ:'#7ee0a5', misiune:'#f2b234', standby:'#7a9ab8', pericol:'#e35a5a'};
const STATUS_CLASSES = {activ:'act', misiune:'msn', standby:'sb', pericol:'dng'};
const DRONE_ICONS = {fire:'🔥', medical:'🚑', rescue:'🆘', delivery:'📦', kamikaze:'💥', swarm:'🐝', generic:'🛸'};

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      dark: {
        type:'raster',
        tiles:['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
               'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
               'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],
        tileSize:256, maxzoom:20, attribution:'© CARTO © OSM'
      }
    },
    layers: [
      {id:'bg', type:'background', paint:{'background-color':'#020810'}},
      {id:'dark', type:'raster', source:'dark'}
    ]
  },
  center: [26.10, 44.43], zoom: 8,
  minZoom: 2, maxZoom: 20
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'top-left');
map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-right');

const markers = {};

function iconFor(d){
  if(d.droneType === 'fire') return '🔥';
  if(d.droneType === 'medical') return '🚑';
  if(d.droneType === 'rescue') return '🆘';
  if(d.droneType === 'delivery') return '📦';
  if(d.status === 'pericol') return '⚠️';
  return '🛸';
}

function renderMarker(d){
  const el = document.createElement('div');
  const stCls = STATUS_CLASSES[d.status] || '';
  el.className = 'marker-drone ' + stCls;
  el.textContent = iconFor(d);
  el.title = `${d.name} · ${d.status}`;
  const popup = new maplibregl.Popup({closeButton:false, offset:22})
    .setHTML(`<b>${d.name}</b><br><span style="color:#aac8e4">${d.model || d.droneType}</span><br>Status: <b style="color:${STATUS_COLORS[d.status]}">${d.status.toUpperCase()}</b><br>Baterie: ${Math.round(d.battery)}% · Alt: ${Math.round(d.alt||0)}m`);
  const m = new maplibregl.Marker({element: el, anchor:'center'})
    .setLngLat([d.lng, d.lat])
    .setPopup(popup)
    .addTo(map);
  markers[d.id] = m;
}

function updateMarker(d){
  if(!markers[d.id]){ renderMarker(d); return; }
  markers[d.id].setLngLat([d.lng, d.lat]);
  const el = markers[d.id].getElement();
  const stCls = STATUS_CLASSES[d.status] || '';
  el.className = 'marker-drone ' + stCls;
  el.textContent = iconFor(d);
}

function removeMarker(id){
  if(markers[id]){ markers[id].remove(); delete markers[id]; }
}

function renderList(drones){
  const el = document.getElementById('dlist');
  el.innerHTML = drones.length ? drones.map(d => {
    const stCls = STATUS_CLASSES[d.status] || '';
    const batLow = d.battery < 30 ? 'low' : '';
    return `<div class="dcard ${stCls}" onclick="focusDrone('${d.id}',${d.lat},${d.lng})">
      <div class="dn">${iconFor(d)} ${d.name}</div>
      <div class="dm">${d.model || d.droneType || '—'}</div>
      <span class="dst" style="background:${STATUS_COLORS[d.status]}20;color:${STATUS_COLORS[d.status]};border:1px solid ${STATUS_COLORS[d.status]}55">${d.status}</span>
      <div class="bat"><i class="${batLow}" style="width:${d.battery}%"></i></div>
    </div>`;
  }).join('') : '<div style="color:#5e7a94;font-size:10px;letter-spacing:1px;padding:12px 0;">Nicio dronă în flotă.</div>';
}

window.focusDrone = function(id, lat, lng){
  map.flyTo({center:[lng, lat], zoom:14, duration:700});
  if(markers[id]) markers[id].togglePopup();
};

function updateStats(drones){
  const s = {activ:0, misiune:0, standby:0, pericol:0};
  drones.forEach(d => { s[d.status] = (s[d.status]||0) + 1; });
  document.getElementById('s-act').textContent = s.activ;
  document.getElementById('s-msn').textContent = s.misiune;
  document.getElementById('s-sb').textContent = s.standby;
  document.getElementById('s-dng').textContent = s.pericol;
  document.getElementById('s-tot').textContent = drones.length;
}

let dronesCache = [];

async function initialLoad(){
  try{
    const res = await fetch(API_BASE + '/api/drones');
    const data = await res.json();
    dronesCache = data;
    data.forEach(renderMarker);
    renderList(data);
    updateStats(data);
    if(data.length){
      const lats = data.map(d=>d.lat), lngs = data.map(d=>d.lng);
      map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], {padding: 60, duration: 700});
    }
  } catch(e){
    console.warn('Initial load fail:', e);
  }
}

function setWs(state){
  document.getElementById('ws-dot').classList.toggle('on', state==='on');
  document.getElementById('ws-txt').textContent = state==='on' ? 'Live conectat' : 'Reconectare...';
}

function connectWs(){
  try{
    const wsUrl = API_BASE.replace(/^http/, 'ws') + '/api/ws/telemetry';
    const ws = new WebSocket(wsUrl);
    ws.onopen = ()=>{ setWs('on'); console.log('[WS] Connected'); };
    ws.onclose = ()=>{ setWs('off'); setTimeout(connectWs, 4000); };
    ws.onmessage = (ev)=>{
      const msg = JSON.parse(ev.data);
      if(msg.type === 'snapshot' && msg.drones){
        dronesCache = msg.drones;
        Object.keys(markers).forEach(id => { if(!dronesCache.find(d=>d.id===id)) removeMarker(id); });
        msg.drones.forEach(updateMarker);
        renderList(msg.drones);
        updateStats(msg.drones);
      }
      else if(msg.type === 'telemetry' && msg.drone){
        const idx = dronesCache.findIndex(d => d.id === msg.drone.id);
        if(idx >= 0) Object.assign(dronesCache[idx], msg.drone);
        updateMarker(msg.drone);
        updateStats(dronesCache);
      }
      else if(msg.type === 'drone_created' && msg.drone){
        dronesCache.push(msg.drone);
        renderMarker(msg.drone);
        renderList(dronesCache);
        updateStats(dronesCache);
      }
      else if(msg.type === 'drone_updated' && msg.drone){
        const idx = dronesCache.findIndex(d => d.id === msg.drone.id);
        if(idx >= 0){ dronesCache[idx] = msg.drone; }
        updateMarker(msg.drone);
        renderList(dronesCache);
        updateStats(dronesCache);
      }
      else if(msg.type === 'drone_deleted' && msg.id){
        dronesCache = dronesCache.filter(d => d.id !== msg.id);
        removeMarker(msg.id);
        renderList(dronesCache);
        updateStats(dronesCache);
      }
    };
    setInterval(()=>{ try{ ws.readyState===1 && ws.send(JSON.stringify({type:'ping'})); }catch(e){} }, 25000);
  } catch(e){ setWs('off'); setTimeout(connectWs, 4000); }
}

map.on('load', ()=>{ initialLoad(); connectWs(); });
</script>
</body>
</html>
